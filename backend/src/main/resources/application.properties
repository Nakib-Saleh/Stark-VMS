spring.application.name=stark-group-vms
# Render sets PORT; locally the API stays on 9001.
server.port=${PORT:9001}
# Behind Render's proxy: take the visitor's address from X-Forwarded-For, but only the entry the
# proxy itself added (Tomcat skips entries from trusted internal addresses, right to left), so a
# made-up header can't dodge the sign-in lockout. HTTPS is reported through X-Forwarded-Proto.
server.forward-headers-strategy=native

# Values come from environment variables (see .env.example and ADR-0004).
# Defaults after the colon are for local development only: the Docker Postgres (localhost only)
# accepts the postgres user without a password.

# PostgreSQL (ADR-0008). Production: Supabase's session pooler with sslmode=require.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stark_group_vms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# The free Supabase pooler allows few connections; 5 is plenty for this app.
spring.datasource.hikari.maximum-pool-size=5
# Our tables live in their own schema, not `public`, which Supabase publishes through its Data API.
spring.flyway.schemas=stark
spring.flyway.default-schema=stark
spring.jpa.properties.hibernate.default_schema=stark

# Websites allowed to call the API (comma-separated). Setting the variable replaces the default.
# Local default allows any localhost port because `flutter run` picks a random one.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# Sign-in (ADR-0005). Leave JWT_SECRET unset locally: a random key is made at startup and
# tokens stop working after a restart. Production must set it (32+ characters).
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=PT8H
# The first admin is created when the users table is empty. With ADMIN_PASSWORD unset, a random
# password is generated and printed once in the log.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.seed=true

# Schema (ADR-0007): Flyway builds and changes the tables from src/main/resources/db/migration.
# To change the schema, add a new V<n>__<what>.sql; never edit one that has already run.
# Hibernate only checks that the entities match the tables, and stops startup if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Preserve field declaration order in JSON responses instead of sorting alphabetically
spring.jackson.mapper.sort-properties-alphabetically=false
