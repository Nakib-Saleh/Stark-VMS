spring.application.name=stark-group-vms
server.port=9001

# Values come from environment variables (see .env.example and ADR-0004).
# Defaults after the colon are for local development only: the Docker MySQL has no root password.

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stark_group_vms}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Websites allowed to call the API (comma-separated). Setting the variable replaces the default.
# Local default allows any localhost port because `flutter run` picks a random one.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# JPA / Hibernate Configuration (if using Spring Data JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Preserve field declaration order in JSON responses instead of sorting alphabetically
spring.jackson.mapper.sort-properties-alphabetically=false
